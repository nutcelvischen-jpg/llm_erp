<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP 智慧助理</title>
<style>
  :root {
    --brand: #0f4c81;
    --brand-soft: #e8f0fa;
    --ink: #1b2430;
    --muted: #6b7686;
    --line: #dde3ec;
    --bg: #f4f6fa;
    --card: #ffffff;
    --danger: #b42318;
    --danger-soft: #fdeceb;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  header {
    background: var(--brand); color: #fff; padding: 14px 24px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: .02em; }
  header p { margin: 0; font-size: 13px; opacity: .85; }

  #chat { flex: 1; overflow-y: auto; padding: 22px 16px 8px; }
  .wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .welcome { text-align: center; padding: 28px 0 4px; }
  .welcome h2 { margin: 0 0 6px; font-size: 22px; }
  .welcome p { margin: 0 0 18px; color: var(--muted); }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; text-align: left; }
  .chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font: inherit; color: var(--ink); cursor: pointer; text-align: left;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .chip:hover:not(:disabled) { border-color: var(--brand); box-shadow: 0 2px 10px rgba(15,76,129,.12); transform: translateY(-1px); }
  .chip:disabled { opacity: .55; cursor: not-allowed; }

  .msg-user { align-self: flex-end; max-width: 80%; background: var(--brand); color: #fff;
    padding: 10px 16px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; word-break: break-word; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: 0 1px 3px rgba(20,30,50,.05); max-width: 100%; }
  .explain { margin: 0 0 12px; font-weight: 600; }
  .empty { color: var(--muted); margin: 0; }

  .table-box { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
  th { background: var(--brand-soft); color: var(--brand); font-weight: 650; position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:nth-child(even) td { background: #fafbfd; }
  tbody tr:last-child td { border-bottom: none; }
  .note { margin: 8px 2px 0; font-size: 13px; color: var(--muted); }

  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--brand); font-size: 14px; user-select: none; }
  .sql-box { position: relative; margin-top: 8px; }
  pre { margin: 0; padding: 14px 16px; background: #0f1b2d; color: #dbe7f7; border-radius: 10px;
    overflow-x: auto; font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .copy { position: absolute; top: 8px; right: 8px; font: 12px inherit; padding: 4px 10px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }
  .copy:hover { background: rgba(255,255,255,.22); }
  .meta { margin: 10px 0 0; font-size: 12px; color: var(--muted); }

  .error { background: var(--danger-soft); border: 1px solid #f3c1bd; color: var(--danger);
    border-radius: 10px; padding: 12px 14px; font-weight: 600; word-break: break-word; }

  .pending { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--brand);
    border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { background: var(--bg); padding: 8px 16px 14px; }
  .composer { max-width: 920px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px;
    box-shadow: 0 2px 12px rgba(20,30,50,.06); }
  .composer:focus-within { border-color: var(--brand); }
  textarea { flex: 1; resize: none; border: none; outline: none; font: inherit; color: var(--ink);
    background: transparent; max-height: 160px; padding: 6px 0; }
  #send { border: none; background: var(--brand); color: #fff; font: inherit; font-weight: 600;
    padding: 8px 20px; border-radius: 10px; cursor: pointer; }
  #send:disabled { background: #9db3cc; cursor: not-allowed; }
  .hint { max-width: 920px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <h1>ERP 智慧助理</h1>
  <p>用中文問 ERP 資料，全程在公司內網處理，資料不外流</p>
</header>

<main id="chat" role="log" aria-live="polite">
  <div class="wrap" id="thread"></div>
</main>

<footer>
  <form class="composer" id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="輸入問題，例如：今年營收最高的三個客戶" aria-label="輸入問題"></textarea>
    <button id="send" type="submit" aria-label="送出問題">送出</button>
  </form>
  <p class="hint">查詢由 AI 產生 SQL，並在唯讀資料庫執行；重要決策請以展開的 SQL 與原始資料為準。</p>
</footer>

<script>
"use strict";
// ---- 可客製的設定（T13c 會改成品牌化） ----
const CONFIG = {
  examples: [
    "哪個客戶今年的營收比去年同期掉最多？",
    "目前逾期超過 60 天的應收帳款有哪些客戶？",
    "哪些料號超過 180 天沒有異動？壓了多少庫存金額？",
    "依目前待出貨的訂單，哪些料號會缺料？建議採購多少？",
    "今年的毛利率比去年同期好還是差？",
    "各供應商的準時交貨率",
  ],
  maxTableRows: 20,
  requestTimeoutMs: 180000,
};

const $ = (id) => document.getElementById(id);
const thread = $("thread"), chatBox = $("chat"), input = $("input"), sendBtn = $("send"), form = $("form");
let busy = false;

// 建立節點的小工具：文字一律用 textContent，絕不使用 innerHTML
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) node.append(c);
  return node;
}
const scrollDown = () => { chatBox.scrollTop = chatBox.scrollHeight; };
const NO_SEPARATOR_COLUMNS = /^(年|年度|年份|季|月|月份)$/;

function fmt(v, col) {
  if (v === null || v === undefined) return "-";
  if (typeof v === "number") {
    if (NO_SEPARATOR_COLUMNS.test(col)) return String(v);
    return Number.isInteger(v) ? v.toLocaleString("zh-TW") : v.toLocaleString("zh-TW", { maximumFractionDigits: 2 });
  }
  if (typeof v === "boolean") return v ? "是" : "否";
  return String(v);
}

function renderTable(columns, rows, rowCount) {
  const shown = rows.slice(0, CONFIG.maxTableRows);
  const isNum = columns.map((_, i) => rows.some((r) => r[i] !== null) && rows.every((r) => r[i] === null || typeof r[i] === "number"));
  const head = el("tr", {}, columns.map((c, i) => el("th", { class: isNum[i] ? "num" : "", text: c })));
  const body = shown.map((r) => el("tr", {}, r.map((v, i) => el("td", { class: isNum[i] ? "num" : "", text: fmt(v, columns[i]) }))));
  const box = el("div", { class: "table-box" }, el("table", {}, [el("thead", {}, head), el("tbody", {}, body)]));
  const frag = document.createDocumentFragment();
  frag.append(box);
  if (rowCount > shown.length) frag.append(el("p", { class: "note", text: `僅顯示前 ${shown.length} 列，共 ${rowCount} 列` }));
  return frag;
}

function renderSql(sql) {
  const copy = el("button", { class: "copy", type: "button", "aria-label": "複製 SQL", text: "複製 SQL" });
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(sql); copy.textContent = "已複製"; }
    catch { copy.textContent = "請手動複製"; }
    setTimeout(() => { copy.textContent = "複製 SQL"; }, 1500);
  });
  return el("details", {}, [
    el("summary", { text: "查詢的 SQL" }),
    el("div", { class: "sql-box" }, [el("pre", { text: sql }), copy]),
  ]);
}

function renderAnswer(card, d) {
  card.replaceChildren();
  if (d.error) {
    card.append(el("div", { class: "error", role: "alert", text: d.error }));
  } else {
    if (d.explanation) card.append(el("p", { class: "explain", text: d.explanation }));
    if (d.row_count > 0) card.append(renderTable(d.columns, d.rows, d.row_count));
    else card.append(el("p", { class: "empty", text: "查詢成功，但沒有符合條件的資料。" }));
  }
  if (d.sql) card.append(renderSql(d.sql));
  if (typeof d.latency_ms === "number") {
    card.append(el("p", { class: "meta", text: `耗時 ${(d.latency_ms / 1000).toFixed(1)} 秒・嘗試 ${d.attempts} 次` }));
  }
}

function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
  input.disabled = v;
  document.querySelectorAll(".chip").forEach((c) => { c.disabled = v; });
  if (!v) input.focus();
}

async function ask(question) {
  question = question.trim();
  if (!question || busy) return;
  document.querySelector(".welcome")?.remove();
  thread.append(el("div", { class: "msg-user", text: question }));

  const secs = el("span", { text: "0" });
  const card = el("div", { class: "card" }, el("div", { class: "pending" }, [
    el("div", { class: "spinner" }), el("span", { text: "思考中… 已 " }), secs, el("span", { text: " 秒" }),
  ]));
  thread.append(card);
  input.value = ""; autoGrow();
  setBusy(true); scrollDown();

  const t0 = Date.now();
  const timer = setInterval(() => { secs.textContent = String(Math.floor((Date.now() - t0) / 1000)); }, 500);
  const ctrl = new AbortController();
  const abortTimer = setTimeout(() => ctrl.abort(), CONFIG.requestTimeoutMs);
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }), signal: ctrl.signal,
    });
    if (!res.ok) {
      const msg = res.status === 422 ? "問題格式不符（長度需為 1–500 字）" : `伺服器回應錯誤（HTTP ${res.status}）`;
      renderAnswer(card, { error: msg });
    } else {
      renderAnswer(card, await res.json());
    }
  } catch (e) {
    const msg = e.name === "AbortError" ? "等待太久，請稍後再試或換個問法" : "無法連線到後端，請確認 make dev 正在執行";
    renderAnswer(card, { error: msg });
  } finally {
    clearInterval(timer); clearTimeout(abortTimer);
    setBusy(false);
    card.scrollIntoView({ block: "start", behavior: "smooth" });  // 讓使用者從回答開頭讀起
  }
}

function showWelcome() {
  const chips = CONFIG.examples.map((q) => {
    const b = el("button", { class: "chip", type: "button", text: q });
    b.addEventListener("click", () => ask(q));
    return b;
  });
  thread.append(el("div", { class: "welcome" }, [
    el("h2", { text: "想知道什麼？直接問我" }),
    el("p", { text: "點下面的範例，或在下方輸入你的問題" }),
    el("div", { class: "chips" }, chips),
  ]));
}

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  // 中文輸入法選字時按 Enter 不能送出（isComposing / keyCode 229）
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    ask(input.value);
  }
});
form.addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });

showWelcome();
input.focus();
</script>
</body>
</html>
