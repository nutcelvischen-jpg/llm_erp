<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP 智慧助理</title>
<style>
  :root {
    --brand: #0f4c81;
    --brand-soft: color-mix(in srgb, var(--brand) 10%, #fff);
    --ink: #1b2430;
    --muted: #6b7686;
    --line: #dde3ec;
    --bg: #f4f6fa;
    --card: #ffffff;
    --danger: #b42318;
    --danger-soft: #fdeceb;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  header { background: var(--brand); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
  header .titles { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: .02em; }
  header p { margin: 0; font-size: 13px; opacity: .85; }
  .hbtn { border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; border-radius: 9px; padding: 5px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(255,255,255,.22); }
  #menuBtn, #newBtnTop { display: none; }
  .drawer-mode #menuBtn, .drawer-mode #newBtnTop { display: inline-block; }

  /* ---- 左側欄：新對話、本次對話的問題、對話紀錄 ---- */
  .sidebar { flex: 0 0 236px; display: flex; flex-direction: column; gap: 6px; padding: 14px 12px; overflow-y: auto;
    background: #eef2f7; border-right: 1px solid var(--line); }
  .drawer-mode .sidebar { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: 280px; transform: translateX(-100%);
    transition: transform .2s; box-shadow: 4px 0 24px rgba(20,30,50,.18); }
  .drawer-mode.drawer-open .sidebar { transform: none; }
  .scrim { display: none; }
  .drawer-mode.drawer-open .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(15,27,45,.35); }
  .new-btn { border: 1px solid var(--brand); background: var(--card); color: var(--brand); border-radius: 10px; padding: 8px 12px; font-weight: 600; cursor: pointer; text-align: left; }
  .new-btn:hover { background: var(--brand-soft); }
  .side-h { margin: 12px 4px 2px; font-size: 12px; font-weight: 650; color: var(--muted); letter-spacing: .04em; }
  .side-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .side-item { display: flex; align-items: center; border-radius: 8px; }
  .side-item:hover { background: #e2e8f0; }
  .side-item.current { background: var(--brand-soft); }
  .side-item > button.go { all: unset; box-sizing: border-box; flex: 1; min-width: 0; padding: 6px 8px; cursor: pointer; font-size: 13px; line-height: 1.4; }
  .side-item > button.go:focus-visible { outline: 2px solid var(--brand); border-radius: 8px; }
  .side-item .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-item .d { display: block; font-size: 11px; color: var(--muted); }
  .side-item.current .t { color: var(--brand); font-weight: 600; }
  .side-item .del { border: none; background: none; color: var(--muted); cursor: pointer; padding: 4px 8px; font-size: 14px; visibility: hidden; border-radius: 6px; }
  .side-item:hover .del, .side-item .del:focus-visible { visibility: visible; }
  .side-item .del:hover { color: var(--danger); background: var(--danger-soft); }
  .toc .side-item { counter-increment: q; }
  .toc .go .t::before { content: counter(q) ". "; color: var(--muted); }
  .toc { counter-reset: q; }
  .side-empty { margin: 2px 6px; font-size: 12px; color: var(--muted); }
  .side-note { margin-top: auto; padding: 10px 4px 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
  .linkbtn { border: none; background: none; color: var(--brand); cursor: pointer; padding: 0; font-size: 11px; text-decoration: underline; }

  .layout { flex: 1; display: flex; min-height: 0; }
  .chat-col { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .wide .chat-col { flex: 0 0 44%; max-width: 640px; border-right: 1px solid var(--line); }
  #chat { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* ---- 右側證據面板（只有寬螢幕才會出現） ---- */
  .panel { display: none; flex: 1; min-width: 0; overflow-y: auto; padding: 20px 22px 28px; background: var(--bg); }
  .wide .panel { display: block; }
  .panel-head { margin: 0 0 14px; }
  .panel-head h2 { margin: 0; font-size: 16px; color: var(--brand); }
  .panel-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); word-break: break-word; }
  .panel-empty { margin-top: 70px; text-align: center; color: var(--muted); }
  .panel-empty b { display: block; font-size: 17px; color: var(--ink); margin-bottom: 4px; }
  .section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .section h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }

  .welcome { text-align: center; padding: 24px 0 4px; }
  .welcome h2 { margin: 0 0 6px; font-size: 22px; }
  .welcome p { margin: 0 0 18px; color: var(--muted); }
  .welcome .more { margin-top: 14px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; text-align: left; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); cursor: pointer; text-align: left;
    transition: border-color .15s, box-shadow .15s, transform .15s; }
  .chip:hover:not(:disabled) { border-color: var(--brand); box-shadow: 0 2px 10px rgba(15,76,129,.12); transform: translateY(-1px); }
  .chip:disabled { opacity: .55; cursor: not-allowed; }

  .msg-user { align-self: flex-end; max-width: 82%; background: var(--brand); color: #fff;
    padding: 10px 16px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; word-break: break-word; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 15px 17px; box-shadow: 0 1px 3px rgba(20,30,50,.05); max-width: 100%; }
  .wide .card.answer { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .wide .card.answer:hover { border-color: #b9c6d8; }
  .card.active { border-color: var(--brand); box-shadow: 0 0 0 2px color-mix(in srgb, var(--brand) 18%, transparent); }
  .explain { margin: 0 0 10px; font-weight: 600; }
  .explain.long { font-weight: 400; white-space: pre-wrap; line-height: 1.65; }
  .warning { background: #fff7e0; border: 1px solid #f0d58a; color: #7a5a00; border-radius: 10px;
    padding: 8px 12px; margin: 0 0 10px; font-size: 13px; font-weight: 600; }
  .card .error + .explain, .explain + .error { margin-top: 10px; }
  .sources ol { margin: 8px 0 0; padding-left: 22px; }
  .sources li { margin-bottom: 8px; }
  .src-title { font-weight: 600; }
  .fb-status { font-size: 12px; color: var(--muted); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; align-items: center; }
  .badge { background: var(--brand); color: #fff; border-radius: 6px; padding: 2px 9px; font-size: 12px; font-weight: 600; }
  .tag { background: var(--brand-soft); color: var(--brand); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
  .notes { margin: -4px 0 10px; font-size: 12px; color: var(--muted); }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .proposal { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fbfcfe; }
  .proposal h4 { margin: 0 0 4px; font-size: 14px; color: var(--brand); }
  .proposal .desc { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  .proposal .cols { margin: 6px 0 8px; font-size: 12px; color: var(--muted); }
  .proposal .warn { margin: 0 0 8px; font-size: 12px; color: #7a5a00; }
  .act { border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 8px; padding: 5px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer; }
  .act.ghost { background: #fff; color: var(--brand); }
  .act:disabled { opacity: .5; cursor: not-allowed; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .src-snippet { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .empty { color: var(--muted); margin: 0; }
  .hintline { margin: 8px 2px 0; font-size: 13px; color: var(--brand); }

  .table-box { overflow: auto; max-height: 380px; border: 1px solid var(--line); border-radius: 10px; }
  .card .table-box { max-height: 260px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
  th { background: var(--brand-soft); color: var(--brand); font-weight: 650; position: sticky; top: 0; padding: 0; }
  th button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 7px 12px; cursor: pointer; text-align: inherit; }
  th button:hover { background: color-mix(in srgb, var(--brand) 8%, transparent); }
  th button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .arrow { display: inline-block; width: 1em; color: var(--brand); font-size: 11px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:nth-child(even) td { background: #fafbfd; }
  tbody tr:last-child td { border-bottom: none; }
  .note { margin: 8px 2px 0; font-size: 13px; color: var(--muted); }

  .chart { width: 100%; height: 300px; }
  details { margin-top: 12px; }
  .section details { margin-top: 0; }
  summary { cursor: pointer; color: var(--brand); font-size: 14px; user-select: none; }
  .sql-box { position: relative; margin-top: 8px; }
  .sql-box pre { padding-top: 40px; }  /* 留位置給右上角的「複製 SQL」，避免蓋住第一行 */
  pre { margin: 0; padding: 14px 16px; background: #0f1b2d; color: #dbe7f7; border-radius: 10px;
    overflow-x: auto; font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  .copy { position: absolute; top: 8px; right: 8px; font-size: 12px; padding: 4px 10px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }
  .copy:hover { background: rgba(255,255,255,.22); }

  .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tool { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 8px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .tool:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
  .tool:disabled { opacity: .5; cursor: not-allowed; }
  .next { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .next-h { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .next-q { border: 1px solid color-mix(in srgb, var(--brand) 35%, #fff); background: var(--brand-soft); color: var(--brand); border-radius: 999px;
    padding: 4px 12px; font-size: 13px; cursor: pointer; text-align: left; }
  .next-q:hover:not(:disabled) { border-color: var(--brand); }
  .next-q:disabled { opacity: .5; cursor: not-allowed; }
  .section-h { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  .section-h h3 { margin: 0; }
  .meta { margin: 0; font-size: 12px; color: var(--muted); flex: 1; min-width: 160px; }
  .fb { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px; padding: 2px 11px; font-size: 12px; cursor: pointer; }
  .fb:hover { border-color: var(--brand); color: var(--brand); }
  .fb[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }

  .error { background: var(--danger-soft); border: 1px solid #f3c1bd; color: var(--danger);
    border-radius: 10px; padding: 12px 14px; font-weight: 600; word-break: break-word; }

  .pending { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skeleton { border-radius: 10px; margin-bottom: 14px; background: linear-gradient(90deg, #e9edf3 25%, #f6f8fb 37%, #e9edf3 63%); background-size: 400% 100%; animation: shimmer 1.3s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  footer { background: var(--bg); padding: 8px 16px 14px; position: relative; }
  #exBtn { border: 1px solid var(--line); background: var(--bg); color: var(--brand); border-radius: 10px; padding: 7px 12px; cursor: pointer; white-space: nowrap; font-weight: 600; }
  #exBtn:hover, #exBtn[aria-expanded="true"] { border-color: var(--brand); background: var(--brand-soft); }
  .examples { position: absolute; left: 16px; right: 16px; bottom: calc(100% - 4px); max-width: 920px; margin: 0 auto; max-height: min(62vh, 560px); overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 34px rgba(20,30,50,.18); padding: 14px 16px; z-index: 20; }
  .examples[hidden] { display: none; }
  .ex-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .ex-top b { color: var(--brand); }
  .ex-group h4 { margin: 10px 0 6px; font-size: 13px; color: var(--muted); }
  .ex-group .sub { font-weight: 400; margin-left: 6px; }
  .ex-items { display: flex; flex-wrap: wrap; gap: 6px; }
  .ex-item { border: 1px solid var(--line); background: #fbfcfe; color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; text-align: left; }
  .ex-item:hover { border-color: var(--brand); color: var(--brand); }
  .composer { max-width: 920px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px; box-shadow: 0 2px 12px rgba(20,30,50,.06); }
  .composer:focus-within { border-color: var(--brand); }
  textarea:focus-visible { outline: none; }  /* 外框由 .composer:focus-within 負責，避免雙層框線 */
  textarea { flex: 1; resize: none; border: none; outline: none; font: inherit; color: var(--ink); background: transparent; max-height: 160px; padding: 6px 0; }
  #send { border: none; background: var(--brand); color: #fff; font-weight: 600; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
  #send:disabled { background: #9db3cc; cursor: not-allowed; }
  .hint { max-width: 920px; margin: 6px auto 0; font-size: 12px; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .spinner, .skeleton { animation: none; } .chip { transition: none; } }
</style>
</head>
<body>
<header>
  <button class="hbtn" id="menuBtn" type="button" aria-label="開啟對話紀錄" aria-controls="sidebar" aria-expanded="false">☰ 紀錄</button>
  <div class="titles">
    <h1 id="brandName">ERP 智慧助理</h1>
    <p id="brandTag">用中文問 ERP 資料，全程在公司內網處理，資料不外流</p>
  </div>
  <button class="hbtn" id="newBtnTop" type="button">＋ 新對話</button>
</header>

<div class="layout" id="layout">
  <nav class="sidebar" id="sidebar" aria-label="對話紀錄">
    <button class="new-btn" id="newBtn" type="button">＋ 新對話</button>
    <h3 class="side-h">本次對話的問題</h3>
    <ol class="side-list toc" id="toc"></ol>
    <h3 class="side-h">對話紀錄</h3>
    <ul class="side-list" id="convos"></ul>
    <p class="side-note">對話紀錄只存在這台電腦的瀏覽器，不會上傳。<br><button class="linkbtn" id="clearAll" type="button">清除全部紀錄</button></p>
  </nav>
  <div class="scrim" id="scrim"></div>
  <section class="chat-col">
    <main id="chat" role="log" aria-live="polite"><div class="wrap" id="thread"></div></main>
    <footer>
      <div class="examples" id="examples" hidden role="dialog" aria-label="範例問題"></div>
      <form class="composer" id="form" autocomplete="off">
        <button id="exBtn" type="button" aria-controls="examples" aria-expanded="false" title="範例問題">💡 範例</button>
        <textarea id="input" rows="1" placeholder="輸入問題，例如：今年營收最高的三個客戶" aria-label="輸入問題"></textarea>
        <button id="send" type="submit" aria-label="送出問題">送出</button>
      </form>
      <p class="hint">數字由公司既定的查詢程式在唯讀資料庫查得；重要決策請以展開的 SQL 與原始資料為準。</p>
    </footer>
  </section>
  <aside class="panel" id="panel" aria-label="分析結果"></aside>
</div>

<script src="/static/vendor/echarts.min.js"></script>
<script>
"use strict";
// ---- 可客製的設定：換公司名稱、色系、範例問題，只要改這裡 ----
const CONFIG = {
  brand: {
    name: "ERP 智慧助理",
    tagline: "用中文問 ERP 資料，全程在公司內網處理，資料不外流",
    color: "#0f4c81",
    palette: ["#0f4c81", "#2a9d8f", "#e9a23b", "#d1495b", "#7a5ea8", "#5b8def"],
  },
  examples: [
    "今年到目前為止毛利跟去年同期比怎樣？哪個客戶掉最多？",
    "哪些客戶的應收逾期超過 60 天？金額多少？",
    "鴻遠機械的合約，延遲交貨罰款怎麼算？",
    "哪些料號超過 180 天沒動？壓了多少錢？",
    "依目前待出貨訂單，哪些料號會缺料？建議採購多少？",
    "員工加班費怎麼計算？依據哪份規章？",
  ],
  // 「💡 範例」選單：依角色分組，點了直接送出
  exampleGroups: [
    { title: "業務與營收", items: ["今年營收前五名的客戶", "今年到目前為止毛利跟去年同期比怎樣？哪個客戶掉最多？", "最近 18 個月每個月的毛利率", "鴻遠機械最近 12 個月每個月的營收", "今年金額最大的五筆訂單"] },
    { title: "財務與應收", items: ["哪些客戶的應收逾期超過 60 天？金額多少？", "應收帳款的帳齡分佈", "台陽科技有哪些發票逾期", "目前總共有多少應收帳款沒收回來？"] },
    { title: "採購與庫存", items: ["依目前待出貨訂單，哪些料號會缺料？建議採購多少？", "哪些料號超過 180 天沒動？壓了多少錢？", "各供應商的準時交貨率", "GEAR-M2-40T 目前庫存多少", "庫存金額最高的 5 個料號"] },
    { title: "合約、規章與規格書", items: ["鴻遠機械的合約，延遲交貨罰款怎麼算？", "精密熱處理依合約標準交期幾天？延遲交貨我們可以怎麼扣款？", "員工加班費怎麼計算？依據哪份規章？", "A 級客訴要多久內提出暫時對策？要用什麼報告回覆？", "GEAR-M2-40T 的材質與硬度是什麼？", "報支金額 5 萬元要誰核准？"] },
    { title: "數字＋文件一起問", sub: "AI 會同時查 ERP 與合約，再合併判斷", items: ["鴻遠機械今年營收多少？依鴻遠機械的合約，今年拿得到折讓嗎？", "台陽科技逾期的應收有多少？依合約可以暫停出貨了嗎？"] },
  ],
  previewRows: 5,        // 寬螢幕：對話卡片內的預覽列數
  inlineRows: 20,        // 窄螢幕：卡片內完整表格的列數上限
  panelRows: 200,        // 右側面板的列數上限
  wideBreakpoint: 1000,  // 螢幕寬度達此值才顯示右側面板
  sidebarBreakpoint: 1240,  // 螢幕寬度達此值左側欄固定顯示，否則收進「☰ 紀錄」
  maxConversations: 30,  // 瀏覽器（localStorage）最多保留幾段對話；設 0 不保存
  requestTimeoutMs: 180000,
};

const $ = (id) => document.getElementById(id);
const thread = $("thread"), chatBox = $("chat"), input = $("input"), sendBtn = $("send"), form = $("form"), panel = $("panel"), layout = $("layout");
const wideQuery = window.matchMedia(`(min-width: ${CONFIG.wideBreakpoint}px)`);
const sideQuery = window.matchMedia(`(min-width: ${CONFIG.sidebarBreakpoint}px)`);
const entries = [];        // 每則回答 {data, card, question, display, choice}
let activeIdx = -1, busy = false, liveCharts = [];
const newId = () => (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2);
let sessionId = newId();   // 一段對話一個 id（稽核用），也是對話紀錄的 key
let startedAt = null;      // 這段對話第一題的時間
const history = [];        // 送給後端的前幾輪對話，最多 6 輪
const MAX_HISTORY = 12;

document.title = CONFIG.brand.name;
$("brandName").textContent = CONFIG.brand.name;
$("brandTag").textContent = CONFIG.brand.tagline;
document.documentElement.style.setProperty("--brand", CONFIG.brand.color);

// 建立節點：文字一律用 textContent，絕不使用 innerHTML
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) node.append(c);
  return node;
}
const isWide = () => wideQuery.matches;
const scrollDown = () => { chatBox.scrollTop = chatBox.scrollHeight; };
const NO_SEPARATOR_COLUMNS = /^(年|年度|年份|季|月|月份)$/;

function fmt(v, col) {
  if (v === null || v === undefined) return "-";
  if (typeof v === "number") {
    if (NO_SEPARATOR_COLUMNS.test(col)) return String(v);
    return Number.isInteger(v) ? v.toLocaleString("zh-TW") : v.toLocaleString("zh-TW", { maximumFractionDigits: 2 });
  }
  if (typeof v === "boolean") return v ? "是" : "否";
  return String(v);
}
const isNumericCol = (rows, i) => rows.some((r) => r[i] !== null) && rows.every((r) => r[i] === null || typeof r[i] === "number");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------------------------------------------------------- 表格（可點欄位標題排序）
function buildTable(columns, rows, limit, total) {
  const numCols = columns.map((_, i) => isNumericCol(rows, i));
  const sort = { col: -1, dir: 1 };
  const tbody = el("tbody");
  const arrows = [];
  const head = el("tr", {}, columns.map((c, i) => {
    const arrow = el("span", { class: "arrow", "aria-hidden": "true" });
    arrows.push(arrow);
    const btn = el("button", { type: "button", "aria-label": `依「${c}」排序` }, [document.createTextNode(c + " "), arrow]);
    btn.addEventListener("click", () => {
      if (sort.col === i) { if (sort.dir === 1) sort.dir = -1; else { sort.col = -1; sort.dir = 1; } } else { sort.col = i; sort.dir = 1; }
      draw();
    });
    return el("th", { class: numCols[i] ? "num" : "" }, btn);
  }));

  function draw() {
    let data = rows;
    if (sort.col >= 0) {
      const c = sort.col;
      data = [...rows].sort((a, b) => {
        const x = a[c], y = b[c];
        if (x === null || x === undefined) return (y === null || y === undefined) ? 0 : 1;   // 空值永遠排最後
        if (y === null || y === undefined) return -1;
        const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "zh-TW");
        return r * sort.dir;
      });
    }
    arrows.forEach((a, i) => { a.textContent = i === sort.col ? (sort.dir === 1 ? "▲" : "▼") : ""; });
    tbody.replaceChildren(...data.slice(0, limit).map((r) => el("tr", {}, r.map((v, i) => el("td", { class: numCols[i] ? "num" : "", text: fmt(v, columns[i]) })))));
  }
  draw();

  const frag = document.createDocumentFragment();
  frag.append(el("div", { class: "table-box" }, el("table", {}, [el("thead", {}, head), tbody])));
  const shown = Math.min(limit, rows.length);
  if (total > shown) frag.append(el("p", { class: "note", text: `僅顯示前 ${shown} 列，共 ${total} 列` }));
  return frag;
}

// ---------------------------------------------------------------- 自動圖表
const MAGNITUDE = (v) => (Math.abs(v) >= 1e8 ? `${+(v / 1e8).toFixed(2)}億` : Math.abs(v) >= 1e4 ? `${+(v / 1e4).toFixed(1)}萬` : String(v));

function chartSpec(columns, rows) {
  if (columns.length < 2 || rows.length < 2 || rows.length > 40) return null;
  const yq = /^年(度|份)?$/.test(columns[0]) && columns[1] === "季";     // 年 + 季 合併成「2025Q3」
  const start = yq ? 2 : 1;
  const numIdx = [];
  for (let i = start; i < columns.length; i++) { if (!isNumericCol(rows, i)) return null; numIdx.push(i); }
  if (numIdx.length < 1 || numIdx.length > 3) return null;
  if (!yq && isNumericCol(rows, 0) && !/(月|年|季|週)/.test(columns[0])) return null;   // 第一欄是一般數字（例如代碼）就不畫
  const labels = rows.map((r) => (yq ? `${r[0]}Q${r[1]}` : String(r[0] ?? "-")));
  const time = yq || /(月|日期|週|季|年)/.test(columns[0]) || labels.every((l) => /^\d{4}-\d{2}(-\d{2})?$/.test(l));
  const series = numIdx.map((i) => ({ name: columns[i], data: rows.map((r) => r[i]) }));
  const scale = series.map((s) => Math.max(0, ...s.data.map((v) => Math.abs(v ?? 0))));
  const axis = series.map((_, k) => (k > 0 && scale[0] > 0 && scale[k] > 0 && (scale[0] / scale[k] > 20 || scale[k] / scale[0] > 20) ? 1 : 0));
  const type = time ? "line" : rows.length > 8 ? "hbar" : "bar";
  if (type === "hbar") {   // 橫條圖只有一條數值軸，量級差太多的欄位不畫（表格裡仍看得到）
    const keep = series.map((_, k) => axis[k] === 0);
    return { labels, series: series.filter((_, k) => keep[k]), axis: axis.filter((_, k) => keep[k]), type };
  }
  return { labels, series, axis, type };
}

function drawChart(div, spec) {
  if (!window.echarts || !div.isConnected) return;
  const pal = CONFIG.brand.palette;
  const horizontal = spec.type === "hbar";
  const nAxes = Math.max(...spec.axis) + 1;
  const valueAxis = (i) => ({ type: "value", axisLabel: { formatter: MAGNITUDE }, splitLine: { show: i === 0 } });
  const chart = window.echarts.init(div);
  chart.setOption({
    color: pal,
    grid: { left: 8, right: 16, top: spec.series.length > 1 ? 40 : 24, bottom: 8, containLabel: true },
    legend: spec.series.length > 1 ? { top: 0 } : undefined,
    tooltip: {
      trigger: "axis", axisPointer: { type: spec.type === "line" ? "line" : "shadow" },
      formatter: (ps) => `${esc(ps[0].axisValueLabel ?? ps[0].name)}<br/>` + ps.map((p) => `${p.marker}${esc(p.seriesName)}：<b>${esc(p.value === null || p.value === undefined ? "-" : Number(p.value).toLocaleString("zh-TW", { maximumFractionDigits: 2 }))}</b>`).join("<br/>"),
    },
    xAxis: horizontal ? valueAxis(0) : { type: "category", data: spec.labels, axisLabel: { interval: 0, rotate: spec.labels.length > 8 ? 30 : 0 } },
    yAxis: horizontal ? { type: "category", data: spec.labels, inverse: true } : (nAxes > 1 ? [valueAxis(0), valueAxis(1)] : valueAxis(0)),
    series: spec.series.map((s, k) => ({
      name: s.name, data: s.data, type: spec.type === "line" ? "line" : "bar", yAxisIndex: horizontal ? 0 : spec.axis[k],
      barMaxWidth: 34, symbolSize: 7, smooth: false,
    })),
  });
  liveCharts.push(chart);
}

function sqlWithBinds(d) {   // SQL 只含 :name 參數；把綁定的值列在下方，方便核對
  const binds = Object.entries(d.binds || {}).map(([k, v]) => `-- :${k} = ${JSON.stringify(v)}`);
  return binds.length ? `${d.sql}\n${binds.join("\n")}` : d.sql;
}

function renderSql(sql, open) {
  const copy = el("button", { class: "copy", type: "button", "aria-label": "複製 SQL", text: "複製 SQL" });
  copy.addEventListener("click", async (e) => {
    e.stopPropagation();
    try { await navigator.clipboard.writeText(sql); copy.textContent = "已複製"; } catch { copy.textContent = "請手動複製"; }
    setTimeout(() => { copy.textContent = "複製 SQL"; }, 1500);
  });
  const d = el("details", {}, [el("summary", { text: "查詢的 SQL" }), el("div", { class: "sql-box" }, [el("pre", { text: sql }), copy])]);
  if (open) d.setAttribute("open", "");
  d.addEventListener("click", (e) => e.stopPropagation());
  return d;
}

function buildSources(sources, open) {
  const items = sources.map((x) => el("li", {}, [
    el("span", { class: "src-title", text: `${x.file_name} 第 ${x.page} 頁${x.heading ? " › " + x.heading : ""}` }),
    el("span", { class: "src-snippet", text: x.snippet || "" }),
  ]));
  const d = el("details", { class: "sources" }, [el("summary", { text: `文件來源（${sources.length}）` }), el("ol", {}, items)]);
  if (open) d.setAttribute("open", "");
  d.addEventListener("click", (e) => e.stopPropagation());
  return d;
}
// ---------------------------------------------------------------- 匯出：CSV（Excel 可直接開）與複製
function csvText(columns, rows) {
  const cell = (v) => { const t = v === null || v === undefined ? "" : String(v); return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  return [columns, ...rows].map((r) => r.map(cell).join(",")).join("\r\n");
}
function downloadCsv(d, title) {
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  const name = `${(title || "查詢結果").replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 40)}_${stamp}.csv`;
  const url = URL.createObjectURL(new Blob(["\ufeff" + csvText(d.columns, d.rows)], { type: "text/csv;charset=utf-8" }));
  const a = el("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function plainAnswer(e) {   // 複製用：問題、回答、表格（Tab 分隔，貼到 Excel 會自動分欄）、來源
  const d = e.data, parts = [`問：${e.display || e.question}`, answerText(d) || d.error || ""];
  if (hasTable(d)) parts.push([d.columns, ...d.rows].map((r) => r.map((v) => fmt(v, "")).join("\t")).join("\n"));
  if (d.sources?.length) parts.push("來源：\n" + d.sources.map((x, i) => `${i + 1}. ${x.file_name} 第 ${x.page} 頁${x.heading ? " › " + x.heading : ""}`).join("\n"));
  return parts.filter(Boolean).join("\n\n");
}
function csvButton(d, title, cls) {
  const b = el("button", { class: cls, type: "button", text: "下載 CSV", "aria-label": "下載表格為 CSV" });
  b.addEventListener("click", (ev) => { ev.stopPropagation(); downloadCsv(d, title); });
  return b;
}

const hasTable = (d) => d.route !== "docs" && d.route !== "chat" && d.row_count > 0;
const answerText = (d) => d.answer ?? d.explanation ?? "";

// 完整的結果內容：圖表 + 表格 + SQL（窄螢幕放在卡片內；寬螢幕放在右側面板）
function buildDetail(d, { limit, sqlOpen, sections, title = "" }) {
  const frag = document.createDocumentFragment();
  const add = (name, node, extra = null) => frag.append(sections
    ? el("div", { class: "section" }, [extra ? el("div", { class: "section-h" }, [el("h3", { text: name }), extra]) : el("h3", { text: name }), node]) : node);
  const spec = hasTable(d) ? chartSpec(d.columns, d.rows) : null;
  if (spec) {
    const div = el("div", { class: "chart", "data-chart-type": spec.type, "data-series": String(spec.series.length), "data-axes": String(Math.max(...spec.axis) + 1), role: "img", "aria-label": "結果圖表" });
    add("圖表", div);
    requestAnimationFrame(() => drawChart(div, spec));
  }
  if (hasTable(d)) add("資料表", buildTable(d.columns, d.rows, limit, d.row_count), sections ? csvButton(d, title, "tool") : null);
  if (d.sql) add("查詢的 SQL", renderSql(sqlWithBinds(d), sqlOpen));
  if (sections && d.sources?.length) add("文件來源", buildSources(d.sources, true));
  return frag;
}

// ---------------------------------------------------------------- 對話卡片與右側面板
function disposeCharts() { liveCharts.forEach((c) => c.dispose()); liveCharts = []; }

function renderPanel() {
  disposeCharts();
  panel.replaceChildren();
  panel.dataset.idx = String(activeIdx);
  const e = entries[activeIdx];
  if (!e || !e.data) {
    panel.append(el("div", { class: "panel-empty" }, [el("b", { text: "分析結果會顯示在這裡" }), document.createTextNode("問一個問題，圖表、完整表格與 SQL 都會出現在右側")]));
    return;
  }
  panel.append(el("div", { class: "panel-head" }, [el("h2", { text: "分析結果" }), el("p", { text: e.question })]));
  const pb = badges(e.data);
  if (pb) panel.append(pb);
  if (!hasTable(e.data) && !e.data.sql && !e.data.sources?.length) {
    panel.append(el("div", { class: "section" }, el("p", { class: "empty", text: "這次查詢沒有可顯示的結果。" })));
  } else {
    panel.append(buildDetail(e.data, { limit: CONFIG.panelRows, sqlOpen: true, sections: true, title: e.data.template_title || e.question }));
  }
}

function setActive(i) {
  const unchanged = i === activeIdx && panel.dataset.idx === String(i);
  activeIdx = i;
  entries.forEach((e, k) => e.card.classList.toggle("active", k === i && isWide()));
  document.querySelectorAll("#toc .side-item").forEach((li, k) => li.classList.toggle("current", k === i));
  if (isWide() && !unchanged) renderPanel();
}

function feedbackRow(e) {
  const d = e.data;
  const row = el("div", { class: "foot" });
  if (typeof d.latency_ms === "number") {
    const rows = d.row_count > 0 ? `・共 ${d.row_count} 列` : "";
    const tries = d.sql && d.attempts && d.mode !== "template" ? `・嘗試 ${d.attempts} 次` : "";   // 既定程式不需要「嘗試次數」
    row.append(el("p", { class: "meta", text: `耗時 ${(d.latency_ms / 1000).toFixed(1)} 秒${tries}${rows}` }));
  }
  const up = el("button", { class: "fb", type: "button", "aria-pressed": "false", "aria-label": "這個回答有幫助", text: "👍 有幫助" });
  const down = el("button", { class: "fb", type: "button", "aria-pressed": "false", "aria-label": "這個回答需要改進", text: "👎 需改進" });
  const status = el("span", { class: "fb-status", role: "status", text: "" });
  for (const [btn, other, score] of [[up, down, 1], [down, up, -1]]) {   // 按下時寫入 app.feedback；取消不送出
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const on = btn.getAttribute("aria-pressed") !== "true";
      const prev = [btn.getAttribute("aria-pressed"), other.getAttribute("aria-pressed")];
      btn.setAttribute("aria-pressed", String(on));
      other.setAttribute("aria-pressed", "false");
      status.textContent = "";
      if (!on || !d.audit_id) return;
      try {
        const res = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ audit_id: d.audit_id, score }) });
        if (!res.ok) throw new Error(String(res.status));
        status.textContent = "已記錄回饋";
      } catch {
        btn.setAttribute("aria-pressed", prev[0]); other.setAttribute("aria-pressed", prev[1]);
        status.textContent = "回饋送出失敗";
      }
    });
  }
  row.append(up, down, status);
  // 操作：複製、下載 CSV、重新查詢
  const copy = el("button", { class: "tool", type: "button", text: "複製", "aria-label": "複製問題、回答與表格" });
  copy.addEventListener("click", async (ev) => {
    ev.stopPropagation();
    try { await navigator.clipboard.writeText(plainAnswer(e)); copy.textContent = "已複製"; } catch { copy.textContent = "無法複製"; }
    setTimeout(() => { copy.textContent = "複製"; }, 1500);
  });
  row.append(copy);
  if (hasTable(d)) row.append(csvButton(d, d.template_title || e.question, "tool"));
  const again = el("button", { class: "tool busy-off", type: "button", text: "重新查詢", "aria-label": "用同一個問題重新查詢" });
  again.addEventListener("click", (ev) => { ev.stopPropagation(); ask(e.question, { choice: e.choice, display: e.display }); });
  row.append(again);
  return row;
}

// 接著問：後端依這次的程式、對象與引用文件產生；這段對話問過的不再出現
function buildFollowups(d) {
  const norm = (q) => q.replace(/[\s？?。，,：:]/g, "");
  const asked = new Set(entries.map((x) => norm(x.question)));
  const qs = (d.followups || []).filter((q) => !asked.has(norm(q)));
  if (!qs.length) return null;
  return el("div", { class: "next" }, [el("p", { class: "next-h", text: "接著問" }),
    el("div", { class: "opts" }, qs.map((q) => {
      const b = el("button", { class: "next-q", type: "button", text: q });
      b.disabled = busy;
      b.addEventListener("click", (ev) => { ev.stopPropagation(); ask(q); });
      return b;
    }))]);
}

function badges(d) {
  if (d.mode !== "template" || !d.template_title) return null;
  return el("div", { class: "badges" }, [el("span", { class: "badge", text: `標準查詢：${d.template_title}` }),
    ...(d.params_readable || []).map((t) => el("span", { class: "tag", text: t }))]);
}

function disableIn(node) { node.querySelectorAll("button.act").forEach((b) => { b.disabled = true; }); }

// 沒有明確命中：列出最接近的既定程式，點選後才執行（後端會重新驗證參數）
function buildProposals(e) {
  const box = el("div", { class: "choices" });
  for (const p of e.data.proposals) {
    const run = el("button", { class: "act", type: "button", text: "執行這個" });
    run.addEventListener("click", (ev) => {
      ev.stopPropagation(); disableIn(box);
      ask(e.question, { choice: { template_id: p.template_id, params: p.params }, display: `執行：${p.title}` });
    });
    box.append(el("div", { class: "proposal" }, [
      el("h4", { text: p.title }), el("p", { class: "desc", text: p.description }),
      el("div", { class: "badges" }, (p.params_readable || []).map((t) => el("span", { class: "tag", text: t }))),
      ...(p.notes || []).map((n) => el("p", { class: "warn", text: `⚠ ${n}` })),
      el("p", { class: "cols", text: `結果欄位：${(p.columns || []).join("、")}` }), run]));
  }
  const none = el("button", { class: "act ghost", type: "button", text: "都不是" });
  none.addEventListener("click", (ev) => {
    ev.stopPropagation(); disableIn(box);
    box.append(el("p", { class: "notes", text: "已記錄這個問題，之後會評估新增既定查詢。" }));
  });
  box.append(el("div", {}, none));
  return box;
}

function buildOptions(items, onPick) {
  const box = el("div", { class: "opts" });
  for (const o of items) {
    const b = el("button", { class: "act ghost", type: "button", text: o });
    b.addEventListener("click", (ev) => { ev.stopPropagation(); disableIn(box); onPick(o); });
    box.append(b);
  }
  return box;
}

function renderCard(e, idx) {
  const { card, data: d } = e;
  card.replaceChildren();
  card.classList.add("answer");
  card.onclick = isWide() ? () => setActive(idx) : null;
  const text = answerText(d);
  if (d.error && !text) {
    card.append(el("div", { class: "error", role: "alert", text: d.error }));
    if (!isWide() && d.sql) card.append(renderSql(sqlWithBinds(d), false));
  } else {
    if (d.warning && hasTable(d)) card.append(el("div", { class: "warning", text: d.warning }));
    const b = badges(d);
    if (b) card.append(b);
    if (d.notes?.length) card.append(el("p", { class: "notes", text: d.notes.join("；") }));
    if (text) card.append(el("p", { class: text.length > 60 || text.includes("\n") ? "explain long" : "explain", text }));
    if (d.mode === "confirm" && d.proposals?.length) card.append(buildProposals(e));
    if (d.mode === "clarify" && d.options?.length) card.append(buildOptions(d.options, (o) => ask(`${e.question}（指：${o}）`)));
    if (d.mode === "no_match" && d.suggestions?.length) {
      card.append(el("p", { class: "notes", text: "可以這樣問：" }));
      card.append(buildOptions(d.suggestions, (q) => ask(q)));
    }
    if (d.error) card.append(el("div", { class: "error", role: "alert", text: `這部分查詢失敗：${d.error}` }));
    if (d.sources?.length) card.append(buildSources(d.sources, false));
    if (d.route === "docs" || d.route === "chat" || (d.mode && d.mode !== "template") || !(d.columns && d.columns.length)) {
      // 文件、閒聊、反問、確認、未命中，或 both 但數字部分沒有執行查詢：都不顯示表格
    } else if (d.row_count === 0) {
      card.append(el("p", { class: "empty", text: "查詢成功，但沒有符合條件的資料。" }));
      if (!isWide() && d.sql) card.append(renderSql(sqlWithBinds(d), false));
    } else if (isWide()) {
      card.append(buildTable(d.columns, d.rows, CONFIG.previewRows, d.row_count).firstChild);   // 只放預覽表格
      card.append(el("p", { class: "hintline", text: "完整結果、圖表與 SQL 在右側 →" }));
    } else {
      card.append(buildDetail(d, { limit: CONFIG.inlineRows, sqlOpen: false, sections: false }));
    }
  }
  const next = buildFollowups(d);
  if (next) card.append(next);
  card.append(feedbackRow(e));
}

function rerenderAll() {   // 視窗在寬／窄之間切換時，重畫所有已完成的回答
  layout.classList.toggle("wide", isWide());
  disposeCharts();
  delete panel.dataset.idx;
  entries.forEach((e, i) => { if (e.data) renderCard(e, i); });
  if (isWide()) setActive(activeIdx >= 0 ? activeIdx : entries.length - 1);
  else { disposeCharts(); panel.replaceChildren(); entries.forEach((e) => e.card.classList.remove("active")); }
}
wideQuery.addEventListener("change", rerenderAll);
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => liveCharts.forEach((c) => c.resize()), 150); });

function setBusy(v) {
  busy = v; sendBtn.disabled = v; input.disabled = v;
  document.querySelectorAll(".chip, .next-q, .busy-off, .new-btn, #newBtnTop").forEach((c) => { c.disabled = v; });
  if (!v) input.focus();
}

async function ask(question, { choice = null, display = null } = {}) {
  question = question.trim();
  if (!question || busy) return;
  closeExamples();
  document.querySelector(".welcome")?.remove();
  if (!startedAt) startedAt = Date.now();
  thread.append(el("div", { class: "msg-user", text: display || question }));

  const secs = el("span", { text: "0" });
  const card = el("div", { class: "card" }, el("div", { class: "pending" }, [el("div", { class: "spinner" }), el("span", { text: "思考中… 已 " }), secs, el("span", { text: " 秒" })]));
  thread.append(card);
  const entry = { data: null, card, question, display, choice };
  entries.push(entry);
  const idx = entries.length - 1;
  renderToc();
  if (isWide()) {   // 面板先顯示骨架畫面
    disposeCharts();
    panel.replaceChildren(el("div", { class: "skeleton", style: "height:46px;width:60%" }), el("div", { class: "skeleton", style: "height:240px" }), el("div", { class: "skeleton", style: "height:160px" }));
    entries.forEach((e) => e.card.classList.remove("active"));
  }
  input.value = ""; autoGrow(); setBusy(true); scrollDown();

  const t0 = Date.now();
  const timer = setInterval(() => { secs.textContent = String(Math.floor((Date.now() - t0) / 1000)); }, 500);
  const ctrl = new AbortController();
  const abortTimer = setTimeout(() => ctrl.abort(), CONFIG.requestTimeoutMs);
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, session_id: sessionId, history: history.slice(-MAX_HISTORY), ...(choice ? { choice } : {}) }), signal: ctrl.signal });
    entry.data = res.ok ? await res.json()
      : { error: res.status === 422 ? "問題格式不符（長度需為 1–500 字）" : `伺服器回應錯誤（HTTP ${res.status}）` };
    const reply = answerText(entry.data);
    if (res.ok && reply) history.push({ role: "user", content: question }, { role: "assistant", content: reply.slice(0, 1000) });
  } catch (e) {
    entry.data = { error: e.name === "AbortError" ? "等待太久，請稍後再試或換個問法" : "無法連線到後端，請確認 make dev 正在執行" };
  } finally {
    clearInterval(timer); clearTimeout(abortTimer);
    renderCard(entry, idx);
    setBusy(false);
    if (isWide()) setActive(idx);
    saveConversation();
    renderToc();
    card.scrollIntoView({ block: "start", behavior: "smooth" });   // 讓使用者從回答開頭讀起
  }
}

function showWelcome() {
  const chips = CONFIG.examples.map((q) => {
    const b = el("button", { class: "chip", type: "button", text: q });
    b.addEventListener("click", () => ask(q));
    return b;
  });
  const more = el("button", { class: "act ghost", type: "button", text: "💡 看更多範例（依業務、財務、採購、文件分類）" });
  more.addEventListener("click", (ev) => { ev.stopPropagation(); openExamples(); });
  thread.append(el("div", { class: "welcome" }, [el("h2", { text: "想知道什麼？直接問我" }), el("p", { text: "點下面的範例，或在下方輸入你的問題" }),
    el("div", { class: "chips" }, chips), el("div", { class: "more" }, more)]));
}

// ---------------------------------------------------------------- 範例選單
const exBox = $("examples"), exBtn = $("exBtn");
function buildExamples() {
  const close = el("button", { class: "tool", type: "button", text: "關閉", "aria-label": "關閉範例" });
  close.addEventListener("click", closeExamples);
  exBox.replaceChildren(el("div", { class: "ex-top" }, [el("b", { text: "範例問題（點了直接送出）" }), close]),
    ...CONFIG.exampleGroups.map((g) => el("div", { class: "ex-group" }, [
      el("h4", {}, [document.createTextNode(g.title), ...(g.sub ? [el("span", { class: "sub", text: `— ${g.sub}` })] : [])]),
      el("div", { class: "ex-items" }, g.items.map((q) => {
        const b = el("button", { class: "ex-item", type: "button", text: q });
        b.addEventListener("click", () => { if (!busy) ask(q); });
        return b;
      }))])));
}
function openExamples() { if (!exBox.childElementCount) buildExamples(); exBox.hidden = false; exBtn.setAttribute("aria-expanded", "true"); exBox.querySelector(".ex-item")?.focus(); }
function closeExamples() { if (exBox.hidden) return; exBox.hidden = true; exBtn.setAttribute("aria-expanded", "false"); }
exBtn.addEventListener("click", (ev) => { ev.stopPropagation(); exBox.hidden ? openExamples() : closeExamples(); });
document.addEventListener("click", (ev) => { if (!exBox.hidden && !exBox.contains(ev.target)) closeExamples(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { closeExamples(); setDrawer(false); } });

// ---------------------------------------------------------------- 對話紀錄（只存在這台電腦的瀏覽器 localStorage）
const STORE_KEY = "erp-assistant.conversations.v1";
const tocBox = $("toc"), convoBox = $("convos");
function loadConversations() {
  try { const v = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; }
}
function storeConversations(list) {
  while (list.length) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); return; } catch { list.pop(); }   // 空間不夠就丟掉最舊的
  }
  try { localStorage.removeItem(STORE_KEY); } catch { /* 瀏覽器不允許儲存 */ }
}
function saveConversation() {
  const items = entries.filter((e) => e.data).map(({ question, display, choice, data }) => ({ question, display, choice, data }));
  if (!items.length) return;
  const convo = { id: sessionId, title: items[0].display || items[0].question, started: startedAt || Date.now(), updated: Date.now(), items, history: history.slice(-MAX_HISTORY) };
  storeConversations([convo, ...loadConversations().filter((c) => c.id !== sessionId)].slice(0, CONFIG.maxConversations));
  renderConversations();
}
function whenText(t) {
  const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
  return d.toDateString() === now.toDateString() ? `今天 ${hm}` : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}
function sideItem(title, sub, onGo, onDel, current) {
  const go = el("button", { class: "go", type: "button", title }, [el("span", { class: "t", text: title }), ...(sub ? [el("span", { class: "d", text: sub })] : [])]);
  go.addEventListener("click", onGo);
  const li = el("li", { class: "side-item" + (current ? " current" : "") }, go);
  if (onDel) {
    const del = el("button", { class: "del", type: "button", text: "✕", "aria-label": `刪除對話：${title}` });
    del.addEventListener("click", (ev) => { ev.stopPropagation(); onDel(); });
    li.append(del);
  }
  return li;
}
function renderConversations() {
  const list = loadConversations();
  convoBox.replaceChildren(...(list.length ? list.map((c) => sideItem(c.title, `${whenText(c.updated)}・${c.items.length} 題`,
    () => openConversation(c.id), () => deleteConversation(c.id), c.id === sessionId)) : [el("li", { class: "side-empty", text: "還沒有紀錄" })]));
}
function renderToc() {
  tocBox.replaceChildren(...(entries.length ? entries.map((e, i) => sideItem(e.display || e.question, e.data ? "" : "查詢中…", () => {
    if (isWide()) setActive(i);
    e.card.previousElementSibling?.scrollIntoView({ block: "start", behavior: "smooth" });
    setDrawer(false);
  }, null, i === activeIdx)) : [el("li", { class: "side-empty", text: "問了問題會列在這裡，點一下跳回該題" })]));
}
function resetThread() {
  disposeCharts();
  thread.replaceChildren();
  entries.length = 0; history.length = 0; activeIdx = -1; startedAt = null;
  delete panel.dataset.idx;
}
function newConversation() {
  if (busy) return;
  resetThread();
  sessionId = newId();
  renderPanel(); showWelcome(); renderToc(); renderConversations(); setDrawer(false);
  input.focus();
}
function openConversation(id) {
  if (busy) return;
  const c = loadConversations().find((x) => x.id === id);
  if (!c) { renderConversations(); return; }
  resetThread();
  sessionId = c.id; startedAt = c.started;
  history.push(...(c.history || []));
  for (const it of c.items) {
    thread.append(el("div", { class: "msg-user", text: it.display || it.question }));
    const card = el("div", { class: "card" });
    thread.append(card);
    entries.push({ data: it.data, card, question: it.question, display: it.display, choice: it.choice || null });
  }
  entries.forEach((e, i) => renderCard(e, i));
  if (isWide()) setActive(entries.length - 1); else renderPanel();
  renderToc(); renderConversations(); setDrawer(false);
  scrollDown();
}
function deleteConversation(id) {
  if (!window.confirm("刪除這段對話紀錄？")) return;
  storeConversations(loadConversations().filter((c) => c.id !== id));
  if (id === sessionId && !busy) newConversation(); else renderConversations();
}
$("clearAll").addEventListener("click", () => {
  if (!window.confirm("清除這台電腦上的全部對話紀錄？")) return;
  try { localStorage.removeItem(STORE_KEY); } catch { /* 忽略 */ }
  if (!busy) newConversation(); else renderConversations();
});
$("newBtn").addEventListener("click", newConversation);
$("newBtnTop").addEventListener("click", newConversation);

// 窄螢幕：左側欄收成抽屜
const menuBtn = $("menuBtn");
function setDrawer(open) {
  layout.parentElement.classList.toggle("drawer-open", open && !sideQuery.matches);
  menuBtn.setAttribute("aria-expanded", String(open && !sideQuery.matches));
}
function applySideMode() { document.body.classList.toggle("drawer-mode", !sideQuery.matches); setDrawer(false); }
menuBtn.addEventListener("click", () => setDrawer(!document.body.classList.contains("drawer-open")));
$("scrim").addEventListener("click", () => setDrawer(false));
sideQuery.addEventListener("change", applySideMode);

function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  // 中文輸入法選字時按 Enter 不能送出（isComposing / keyCode 229）
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); ask(input.value); }
});
form.addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });

layout.classList.toggle("wide", isWide());
applySideMode();
renderPanel();
showWelcome();
renderToc();
renderConversations();
input.focus();
</script>
</body>
</html>
